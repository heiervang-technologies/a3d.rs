[package]
name = "a3d"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "GPU-accelerated ASCII 3D rendering engine"
license = "MIT"
repository = "https://github.com/heiervang-technologies/a3d.rs"
readme = "README.md"
keywords = ["ascii", "3d", "renderer", "terminal", "gpu"]
categories = ["command-line-utilities", "rendering"]
# Keep the published crate lean: the demo GIF (~1.5 MB) and dev/CI files aren't
# needed to build or use a3d. They stay in the git repo regardless.
exclude = ["assets/", ".github/", "CLAUDE.md", "Makefile"]

[dependencies]
wgpu = "26"
glam = "0.33"
crossterm = "0.29"
tobj = "4"
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
stl_io = "0.11"

[profile.release]
# Strip symbols from the release binary — ~21% smaller (8.9 MB -> 7.0 MB) with
# no runtime cost and no added build time.
strip = true
